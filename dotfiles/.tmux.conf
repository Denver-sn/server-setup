# Prefix : Ctrl+a au lieu de Ctrl+b
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Terminal 256 couleurs
set -g default-terminal "tmux-256color"

# Commencer les index à 1
set -g base-index 1
setw -g pane-base-index 1

# Mouse support
set -g mouse on

# Historique
set -g history-limit 50000

# Vi mode
setw -g mode-keys vi

# Split avec | et -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigation entre panes avec Alt+fleches
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize avec Ctrl+fleches
bind -r C-Left resize-pane -L 5
bind -r C-Right resize-pane -R 5
bind -r C-Up resize-pane -U 5
bind -r C-Down resize-pane -D 5

# Reload config
bind r source-file ~/.tmux.conf \; display "Config rechargée"

# Status bar
set -g status-position bottom
set -g status-style 'bg=#1e1e2e fg=#cdd6f4'
set -g status-left ' #S '
set -g status-right ' %H:%M %d/%m '
